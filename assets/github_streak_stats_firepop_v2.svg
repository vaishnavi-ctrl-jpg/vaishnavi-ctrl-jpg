<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <!-- GLASSMORPHISM DARK CYBER SLATE GRADIENT -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181524" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F0C18" stop-opacity="0.98"/>
    </linearGradient>

    <!-- NEON PINK TO PURPLE BORDER GRADIENT -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DA9EE2"/>
      <stop offset="50%" stop-color="#F7C3DB"/>
      <stop offset="100%" stop-color="#B07EF0"/>
    </linearGradient>
  </defs>

  <!-- MAIN CARD BACKGROUND -->
  <rect x="10" y="10" width="980" height="360" rx="24" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- SOLID COLUMN DIVIDERS -->
  <line x1="330" y1="45" x2="330" y2="335" stroke="#DA9EE2" stroke-opacity="0.25" stroke-width="1.5"/>
  <line x1="670" y1="45" x2="670" y2="335" stroke="#DA9EE2" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- COLUMN 1: TOTAL CONTRIBUTIONS -->
  <text x="170" y="140" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="60" fill="#F7EEFA" text-anchor="middle">326</text>
  <text x="170" y="210" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="26" fill="#DA9EE2" text-anchor="middle">Total Contributions</text>
  <text x="170" y="270" font-family="'Segoe UI', sans-serif" font-size="20" fill="#B07EF0" text-anchor="middle">Aug 2025 - Present</text>

  <!-- COLUMN 2: CURRENT STREAK (SMIL SPINNER ENDS -> FIRE POPS -> CONFETTI) -->
  
  <!-- SMIL ANIMATED ROTATING SPINNER RING -->
  <g transform="translate(500, 132)">
    <path d="M -45 -45 A 64 64 0 1 0 45 -45" fill="none" stroke="#B07EF0" stroke-width="6" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- SMIL ANIMATED FIRE POP BADGE (POPS IN AT END OF SPIN, THEN FIXED!) -->
  <g transform="translate(500, 68)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="0; 0; 1.25; 1.0; 1.0; 0" keyTimes="0; 0.3; 0.4; 0.46; 0.88; 1" dur="4s" repeatCount="indefinite"/>
      <path d="M 0 -18 C 9 -3 18 4 18 14 C 18 26 9 34 0 34 C -9 34 -18 26 -18 14 C -18 4 -9 -3 0 -18 Z" fill="#FF77BC"/>
      <path d="M 0 0 C 5 9 10 13 10 20 C 10 27 5 31 0 31 C -5 31 -10 27 -10 20 C -10 13 -5 9 0 0 Z" fill="#F7C3DB"/>
    </g>
  </g>

  <!-- STREAK NUMBER INSIDE RING -->
  <text x="500" y="152" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="58" fill="#EFB5E3" text-anchor="middle">3</text>

  <!-- SMIL ANIMATED HOLOGRAM 2 CONFETTI BURST -->
  <g transform="translate(500, 132)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="0.2; 0.2; 1.2; 1.35; 0.2" keyTimes="0; 0.35; 0.45; 0.7; 1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 0; 1; 0; 0" keyTimes="0; 0.35; 0.45; 0.7; 1" dur="4s" repeatCount="indefinite"/>
      
      <!-- Confetti Particles -->
      <path d="M 0 -110 L 3 -104 L 9 -101 L 3 -98 L 0 -92 L -3 -98 L -9 -101 L -3 -104 Z" fill="#F7C3DB"/>
      <path d="M -60 -85 L -56 -79 L -50 -75 L -56 -71 L -60 -65 L -64 -71 L -70 -75 L -64 -79 Z" fill="#DA9EE2"/>
      <path d="M 60 -85 L 64 -79 L 70 -75 L 64 -71 L 60 -65 L 56 -71 L 50 -75 L 56 -79 Z" fill="#EFB5E3"/>
      <circle cx="-90" cy="-40" r="5" fill="#FF77BC"/>
      <polygon points="-100,-10 -92,-5 -97,3 -105,-2" fill="#B07EF0"/>
      <circle cx="90" cy="-40" r="5" fill="#EFB5E3"/>
      <polygon points="100,-10 108,-5 103,3 95,-2" fill="#F7C3DB"/>
      <circle cx="0" cy="95" r="4" fill="#B07EF0"/>
    </g>
  </g>

  <!-- LABELS UNDER CIRCLE -->
  <text x="500" y="245" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="28" fill="#F7C3DB" text-anchor="middle">Current Streak</text>
  <text x="500" y="295" font-family="'Segoe UI', sans-serif" font-size="20" fill="#B07EF0" text-anchor="middle">Aug 8 - Aug 10</text>

  <!-- COLUMN 3: LONGEST STREAK -->
  <text x="830" y="140" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="60" fill="#F7EEFA" text-anchor="middle">4</text>
  <text x="830" y="210" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="26" fill="#DA9EE2" text-anchor="middle">Longest Streak</text>
  <text x="830" y="270" font-family="'Segoe UI', sans-serif" font-size="20" fill="#B07EF0" text-anchor="middle">Apr 17 - Apr 20</text>
</svg>
